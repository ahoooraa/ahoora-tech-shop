
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>آدرس و تماس با ما | اهورا تکنیک</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      line-height: 2;
    }

    header {
      background: #101d35;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      color: #fbbf24;
      margin: 0;
      font-size: 30px;
    }

    main {
      width: 92%;
      max-width: 650px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 10px 30px #00000010;
      text-align: center;
    }

    .icon { font-size: 48px; }

    h2 { color: #101d35; }

    .info {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin: 15px 0;
    }

    .info strong {
      display: block;
      color: #64748b;
    }

    .phone {
      display: inline-block;
      direction: ltr;
      color: #1d4ed8;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      margin: 3px 8px;
    }

    .btn {
      display: block;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 14px;
    }

    .map { background: #16a34a; color: white; }
    .home { background: #101d35; color: white; }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
